spring.application.name=ud03-rvl-usuarios-roles
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3311/users-roles-rvl}
spring.datasource.username=${DB_USER:rvl_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.thymeleaf.encoding=UTF-8
server.port=${SERVER_PORT:8081}
server.error.include-message=never
