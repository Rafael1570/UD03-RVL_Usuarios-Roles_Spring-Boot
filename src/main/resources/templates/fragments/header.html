<header class="border-bottom bg-light" th:fragment="header" xmlns:th="http://www.thymeleaf.org">
  <nav class="navbar navbar-expand-lg"><div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" th:href="@{/}"><img th:src="@{/images/logo.svg}" alt="" width="40" height="32" class="me-2"><span class="fw-semibold text-primary" th:text="#{app.name}">Usuarios y roles</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" th:aria-label="#{nav.toggle}"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.home}">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/users}" th:text="#{nav.users}">Usuarios</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/roles}" th:text="#{nav.roles}">Roles</a></li>
      </ul>
      <form method="get" class="d-lg-flex align-items-center me-3" th:action="@{/}">
        <label for="langSelect" class="visually-hidden" th:text="#{nav.language}">Idioma</label>
        <select id="langSelect" name="lang" class="form-select form-select-sm" onchange="this.form.submit()">
          <option value="es" th:selected="${#locale.language == 'es'}">Español</option>
          <option value="en" th:selected="${#locale.language == 'en'}">English</option>
        </select>
      </form>
    </div>
  </div></nav>
</header>
